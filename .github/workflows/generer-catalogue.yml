name: Générer le catalogue VINOM

# Déclenchement :
#  - automatique quand le fichier Excel maître OU le script change dans data/ ou scripts/
#  - programmé chaque lundi (fait tomber les badges "Nouveau" expirés sans modif Excel)
#  - manuel via le bouton "Run workflow" (utile pour tester)
on:
  push:
    paths:
      - 'data/TarifVinom_Master.xlsx'
      - 'scripts/generate_tarif.py'
  schedule:
    - cron: '0 6 * * 1'        # tous les lundis 06:00 UTC (~08h Paris l'été, 07h l'hiver)
  workflow_dispatch:

# Permet au workflow d'écrire dans le dépôt (commit du tarif.json)
permissions:
  contents: write

# AJOUT — sérialise les exécutions : si Power Automate pousse deux fois
# coup sur coup, le 2e run attend la fin du 1er au lieu de pousser en même temps.
# cancel-in-progress: false => on met en file d'attente, on n'annule rien.
concurrency:
  group: generer-catalogue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install openpyxl

      - name: Générer tarif.json
        run: |
          python scripts/generate_tarif.py \
            --excel "data/TarifVinom_Master.xlsx" \
            --output "tarif.json"

      - name: Publier tarif.json (si modifié)
        run: |
          git config user.name "VINOM Catalogue Bot"
          git config user.email "actions@github.com"
          if git diff --quiet tarif.json; then
            echo "Aucun changement dans tarif.json — rien à publier."
            exit 0
          fi
          git add tarif.json
          git commit -m "Mise à jour automatique du catalogue ($(date '+%Y-%m-%d %H:%M'))"

          # AJOUT — 3 tentatives de rebase+push. Si un autre run a poussé entre
          # temps, on rejoue au lieu de sortir en exit code 1.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "tarif.json mis à jour et publié (tentative $i)."
              exit 0
            fi
            echo "Push refusé (tentative $i) — nouvelle tentative dans 10 s..."
            git rebase --abort 2>/dev/null || true
            sleep 10
          done

          # AJOUT — si tarif.json est déjà identique à celui de origin/main,
          # c'est qu'un run concurrent a publié le même contenu : ce n'est pas une erreur.
          git fetch origin main
          if git diff --quiet origin/main -- tarif.json; then
            echo "Contenu déjà publié par un run concurrent — rien à faire."
            exit 0
          fi
          echo "::error::Impossible de publier tarif.json après 3 tentatives."
          exit 1
